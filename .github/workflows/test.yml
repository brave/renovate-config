name: Validate Renovate Config

on:
    push:
        branches:
        - main
        - master
    pull_request:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
            node-version: '24.x'

        - name: Enable corepack
          run: corepack enable

        - name: Validate Renovate configs
          run: |
            pnpm dlx --package renovate -- renovate-config-validator \
              default.json lockfile-*.json enable-*.json

    needs_migration:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
            node-version: '24.x'

        - name: Enable corepack
          run: corepack enable

        - name: Validate Renovate configs
          run: |
            pnpm dlx --package renovate -- renovate-config-validator --strict \
              default.json lockfile-*.json enable-*.json
